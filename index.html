<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Binder — Clash of Cards Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Luckiest+Guy&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15142a;
  --bg-elevated:#1e1c3a;
  --panel:#242245;
  --slot:#2b2950;
  --slot-empty:#201f3d;
  --ink:#f2ecdd;
  --ink-dim:#a6a1c4;
  --ink-faint:#615c86;
  --gold:#e8b84b;
  --gold-glow:rgba(232,184,75,.35);
  --line:#3a3766;

  --elixir:#e0479f;
  --elixir-dim:#3d1f3a;
  --darkelixir:#8b5cf6;
  --darkelixir-dim:#2a2154;
  --builder:#2fd1c5;
  --builder-dim:#173d3f;
  --super:#ff6a3d;
  --super-dim:#3f2318;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 8%, #201e42 0%, transparent 45%),
    radial-gradient(circle at 85% 92%, #1c1938 0%, transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px;}

/* ---------- Header ---------- */
header.app-head{
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;
  padding:22px 24px;border-radius:18px;
  background:linear-gradient(135deg,#221f45,#181731);
  border:1px solid var(--line);
  position:relative;overflow:hidden;
  margin-bottom:18px;
}
header.app-head::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, transparent 2px 14px);
  pointer-events:none;
  z-index:0;
}
.title-block{position:relative;z-index:1;}
.title-block h1{
  font-family:'Bungee',cursive;
  font-size:26px;
  letter-spacing:.5px;
  margin:0 0 6px;
  color:var(--gold);
  text-shadow:0 2px 0 rgba(0,0,0,.4);
}
.title-block p{margin:0;color:var(--ink-dim);font-size:13.5px;max-width:520px;line-height:1.5;}
.event-clock{
  position:relative;z-index:1;isolation:isolate;
  text-align:right;font-family:'JetBrains Mono',monospace;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;
}
.event-clock .label{font-size:10px;letter-spacing:1.5px;color:var(--ink-faint);text-transform:uppercase;}
.event-clock .value{font-size:19px;color:var(--gold);font-weight:600;}
.event-clock .sub{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}

/* ---------- Sync / mode bars ---------- */
.sync-bar{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);
  padding:8px 14px;margin-bottom:10px;
}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--builder);box-shadow:0 0 8px var(--builder);flex:none;}
.btn.tiny.secondary{padding:5px 12px;font-size:11px;}

.mode-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-radius:12px;margin-bottom:14px;
  background:var(--bg-elevated);border:1px solid var(--line);font-size:13px;color:var(--ink-dim);
}
.mode-bar.contribute{border-color:var(--builder);background:var(--builder-dim);color:var(--ink);}
.mode-bar .chip{margin-left:auto;}

.banner-warn{
  background:var(--super-dim);border:1px solid var(--super);border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:14px;
}
.banner-warn b{color:var(--ink);}

/* ---------- Account bar ---------- */
.account-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 14px;background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:14px;margin-bottom:16px;
}
.account-bar .label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-faint);margin-right:4px;}
.chip{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-dim);font-size:13.5px;font-weight:600;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--gold);color:var(--ink);}
.chip.active{
  background:linear-gradient(135deg,var(--gold),#c9922f);
  color:#241a05;border-color:transparent;
}
.chip.add{background:transparent;border-style:dashed;color:var(--ink-faint);}
.chip.add:hover{color:var(--gold);border-color:var(--gold);}
.chip-x{margin-left:8px;opacity:.55;font-weight:400;}
.chip-x:hover{opacity:1;}
.chip-pencil{margin-left:8px;opacity:.5;font-weight:400;font-size:12px;display:inline-block;}
.chip-pencil:hover{opacity:1;}
.chip-lock{margin-left:7px;opacity:.6;font-size:11px;}
.chip.active .chip-pencil,.chip.active .chip-x,.chip.active .chip-lock{opacity:.7;}
.chip.active .chip-pencil:hover,.chip.active .chip-x:hover{opacity:1;}
.chip-edit-wrap{display:inline-flex;align-items:center;}
.chip-input{
  padding:6.5px 14px;border-radius:999px;
  border:1px solid var(--gold);background:var(--panel);color:var(--ink);
  font-size:13.5px;font-weight:600;font-family:inherit;
  outline:none;min-width:80px;max-width:180px;
  box-shadow:0 0 0 3px var(--gold-glow);
}

/* ---------- Nav tabs ---------- */
.view-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.view-tab{
  padding:9px 16px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--ink-faint);font-weight:600;font-size:13.5px;
  cursor:pointer;font-family:inherit;
}
.view-tab:hover{color:var(--ink-dim);}
.view-tab.active{background:var(--panel);color:var(--gold);border-color:var(--line);}

.view{display:none;}
.view.active{display:block;}

/* ---------- Category tabs + progress ---------- */
.cat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.cat-card{
  flex:1 1 220px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;transition:.15s;
}
.cat-card:hover{transform:translateY(-1px);}
.cat-card .cat-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cat-dot{width:10px;height:10px;border-radius:3px;flex:none;}
.cat-progress-track{height:7px;border-radius:4px;background:var(--slot-empty);overflow:hidden;}
.cat-progress-fill{height:100%;border-radius:4px;}
.cat-count{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
.cat-card.selected{outline:2px solid var(--gold);}

.overall-bar{
  display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-elevated);
  border:1px solid var(--line);border-radius:14px;margin-bottom:20px;
}
.overall-bar .ring{
  width:56px;height:56px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:var(--gold);
  background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), var(--slot-empty) 0);
  position:relative;
}
.overall-bar .ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg-elevated);}
.overall-bar .ring span{position:relative;z-index:1;}
.overall-bar .txt{font-size:13px;color:var(--ink-dim);}
.overall-bar .txt b{color:var(--ink);}
.overall-bar .readonly-tag{
  margin-left:auto;font-size:11px;color:var(--ink-faint);border:1px solid var(--line);
  padding:4px 10px;border-radius:999px;white-space:nowrap;
}

/* ---------- Binder grid (ring holes) ---------- */
.binder-page{
  position:relative;background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:16px;padding:22px 22px 22px 44px;
}
.binder-page::before{
  content:"";position:absolute;left:14px;top:20px;bottom:20px;width:10px;
  background-image:radial-gradient(circle, var(--bg) 4px, transparent 4.5px);
  background-size:10px 26px;background-repeat:repeat-y;
  border-radius:6px;
}
.card-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
}
.card-slot{
  position:relative;border-radius:13px;overflow:hidden;
  border:2px solid var(--catcolor);
  aspect-ratio:5/7;display:flex;flex-direction:column;
  background:var(--bg-elevated);
  transition:transform .12s ease, box-shadow .12s ease;
}
.card-slot:hover{transform:translateY(-2px);}

.card-art{
  position:relative;flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--catcolor) 30%, transparent), transparent 72%),
    var(--catbg, var(--slot));
  padding:12%;
}
.card-art-img{
  width:100%;height:100%;
  background-image:var(--cardimg, none);
  background-size:contain;background-repeat:no-repeat;background-position:center;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));
}
.card-slot.empty .card-art-img{
  filter:grayscale(1) brightness(.65) contrast(1.1);
  opacity:.85;
}
.card-slot.excluded{opacity:.32;filter:grayscale(.9);}

.card-slot.dup{
  border-color:var(--gold);
  box-shadow:0 0 0 2px var(--gold-glow), 0 0 16px var(--gold-glow);
}
.card-slot.dup .card-art{
  background:
    radial-gradient(circle at 50% 32%, var(--gold-glow), transparent 75%),
    var(--catbg, var(--slot));
}
.card-dup-badge{
  position:absolute;top:6px;right:6px;z-index:2;
  background:linear-gradient(135deg,var(--gold),#c9922f);color:#241a05;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11.5px;
  padding:2px 8px;border-radius:999px;
  border:1.5px solid rgba(36,26,5,.35);
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}

.card-name{
  flex:none;text-align:center;line-height:1.2;color:var(--ink);font-weight:400;
  font-family:'Luckiest Guy',cursive;letter-spacing:.3px;
  font-size:13.5px;padding:7px 5px 5px;
  background:rgba(0,0,0,.24);border-top:1px solid rgba(255,255,255,.06);
}
.card-slot.empty .card-name{color:var(--ink-faint);}

.card-stepper{display:flex;align-items:stretch;border-top:1px solid rgba(0,0,0,.4);}
.card-stepper button{
  flex:1;border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:15px;padding:5px 0;line-height:1;transition:.12s;
}
.card-stepper button[data-action="dec"]{background:var(--panel);color:var(--ink-dim);}
.card-stepper button[data-action="dec"]:hover:not(:disabled){background:var(--slot-empty);color:var(--ink);}
.card-stepper button[data-action="inc"]{background:linear-gradient(135deg,var(--gold),#c9922f);color:#241a05;}
.card-stepper button[data-action="inc"]:hover{filter:brightness(1.08);}
.card-stepper button:disabled{opacity:.35;cursor:default;}
.card-stepper .count{
  flex:none;width:28px;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;
  background:var(--bg-elevated);color:var(--ink);
}
.excl-tag, .readonly-count{
  text-align:center;font-size:9px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--ink-faint);padding:7px 2px;background:var(--panel);
}
.readonly-count{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink-dim);}

/* ---------- Matrix view ---------- */
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg-elevated);}
table.matrix{border-collapse:collapse;width:100%;font-size:12.5px;}
table.matrix th, table.matrix td{padding:7px 10px;text-align:center;white-space:nowrap;}
table.matrix thead th{
  position:sticky;top:0;background:var(--panel);color:var(--gold);font-weight:700;
  border-bottom:1px solid var(--line);z-index:2;
}
table.matrix td.rowlabel, table.matrix th.corner{
  position:sticky;left:0;background:var(--panel);text-align:left;font-weight:600;
  z-index:1;border-right:1px solid var(--line);
}
table.matrix th.corner{z-index:3;}
table.matrix tr.cat-sep td{background:var(--bg);font-weight:700;color:var(--catcolor);text-align:left;padding-top:12px;}
table.matrix td.cell{font-family:'JetBrains Mono',monospace;}
.cell-0{color:var(--ink-faint);}
.cell-1{color:var(--ink);}
.cell-dup{color:var(--gold);font-weight:700;background:rgba(232,184,75,.08);border-radius:6px;}

/* ---------- Trade finder ---------- */
.trade-filter-row{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
}
.trade-filter-row input[type="text"]{
  flex:1;min-width:160px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13.5px;
}
.trade-filter-row label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;}

.duptrade-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.duptrade-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--line);font-size:13px;
}
.duptrade-row .who{font-weight:700;}
.duptrade-row .tag{font-size:10px;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap;}
.duptrade-row .spare{font-family:'JetBrains Mono',monospace;color:var(--gold);font-weight:700;font-size:12px;}
.duptrade-row select{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;font-family:inherit;font-size:12.5px;
}
.duptrade-row .duptrade-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

.trade-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;background:var(--panel);margin-bottom:6px;font-size:13px;
}
.trade-item .tag{font-size:10px;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap;}
.trade-item-right{display:flex;align-items:center;gap:8px;flex:none;}
.btn.tiny{padding:5px 10px;font-size:11.5px;border-radius:7px;white-space:nowrap;}
.log-time{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.empty-note{color:var(--ink-faint);font-size:13px;padding:10px 2px;}

/* ---------- Import / export & editor ---------- */
.panel-box{background:var(--bg-elevated);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.panel-box h3{margin:0 0 8px;color:var(--gold);font-size:15px;}
.panel-box p{color:var(--ink-dim);font-size:13px;line-height:1.5;}
textarea{
  width:100%;min-height:110px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;resize:vertical;
}
.btn{
  background:linear-gradient(135deg,var(--gold),#c9922f);color:#241a05;border:none;
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}
.btn.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:#4a2130;color:#ffb4c6;border:1px solid #6b2f42;}
.btn:disabled{opacity:.4;cursor:default;}
.btn-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.status-msg{font-size:12.5px;margin-top:8px;color:var(--builder);}

.editor-row{
  display:grid;grid-template-columns:1fr 1fr 130px 90px;gap:8px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);
}
.editor-row input, .editor-row select{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-family:inherit;font-size:13px;width:100%;
}
@media(max-width:640px){.editor-row{grid-template-columns:1fr;}}

.loading{text-align:center;padding:60px 20px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;}

/* ---------- Global toast ---------- */
.global-toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--bg-elevated);border:1px solid var(--gold);color:var(--ink);
  padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.2s ease;z-index:10500;max-width:90vw;text-align:center;
}
.global-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Onboarding tutorial ---------- */
.tutorial-root{position:fixed;inset:0;z-index:9998;}
.tutorial-mask{
  position:fixed;background:rgba(8,7,18,.82);z-index:9998;
  pointer-events:auto;transition:all .22s ease;
}
.tutorial-ring{
  position:fixed;z-index:9999;pointer-events:none;border-radius:14px;
  border:2px solid var(--gold);
  box-shadow:0 0 0 4px var(--gold-glow), 0 0 26px var(--gold-glow);
  transition:all .22s ease;
}
.tutorial-card{
  position:fixed;z-index:10000;width:300px;max-width:calc(100vw - 24px);
  background:var(--bg-elevated);border:1px solid var(--gold);border-radius:14px;
  padding:16px 18px;box-shadow:0 10px 34px rgba(0,0,0,.55);
  transition:top .22s ease,left .22s ease;
}
.tutorial-progress{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px;
}
.tutorial-card h4{margin:0 0 6px;font-family:'Luckiest Guy',cursive;font-size:18px;color:var(--ink);letter-spacing:.3px;}
.tutorial-card p{margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--ink-dim);}
.tutorial-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.tutorial-btn{border:none;border-radius:8px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
.tutorial-btn.skip{background:transparent;color:var(--ink-faint);padding-left:2px;}
.tutorial-btn.skip:hover{color:var(--ink);}
.tutorial-btn.next{background:linear-gradient(135deg,var(--gold),#c9922f);color:#241a05;}
.tutorial-btn.next:hover{filter:brightness(1.08);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading the gallery…</div>
</div>
<div class="tutorial-root" id="tutorial-root" style="display:none;"></div>

<script>
/* ============================================================
   STORAGE KEYS
   Shared keys are visible to EVERY user of this artifact link.
   Personal keys are scoped to the current browser/user only.
   ============================================================ */
const K_ROSTER      = "gallery-roster";       // shared: { cards:[...], schemaVersion }
const K_ACCOUNTS    = "gallery-accounts";     // shared: { list:[{name, locked}] }
const K_COLLECTIONS = "gallery-collections";  // shared: { [account]: { [cardId]: count } }
const K_TRADELOG    = "gallery-tradelog";     // shared: { entries:[...] }
const K_SETTINGS    = "my-gallery-settings";  // personal: { mode, myAccount }
const LEGACY_KEY     = "coc-cards-app-data";  // old personal single-user format (pre-gallery)
const TUTORIAL_KEY   = "coc-tutorial-seen-v2";

const CATEGORIES = [
  {key:"elixir",      label:"Elixir Troops",       color:"var(--elixir)",      hex:"#ff2e9a", dim:"var(--elixir-dim)"},
  {key:"darkElixir",  label:"Dark Elixir Troops",  color:"var(--darkelixir)",  hex:"#7c3aed", dim:"var(--darkelixir-dim)"},
  {key:"builderBase", label:"Builder Base Troops", color:"var(--builder)",     hex:"#00d4c8", dim:"var(--builder-dim)"},
  {key:"superTroop",  label:"Super Troops",        color:"var(--super)",       hex:"#ff5722", dim:"var(--super-dim)"}
];

// Official droptable order, as confirmed from the in-game Collection screen.
const DEFAULT_CARDS = [
  // Elixir Troops (19)
  ["elixir","barbarian","Barbarian"],["elixir","archer","Archer"],["elixir","giant","Giant"],
  ["elixir","goblin","Goblin"],["elixir","wall-breaker","Wall Breaker"],["elixir","balloon","Balloon"],
  ["elixir","wizard","Wizard"],["elixir","healer","Healer"],["elixir","dragon","Dragon"],
  ["elixir","pekka","P.E.K.K.A"],["elixir","baby-dragon","Baby Dragon"],["elixir","miner","Miner"],
  ["elixir","electro-dragon","Electro Dragon"],["elixir","yeti","Yeti"],["elixir","dragon-rider","Dragon Rider"],
  ["elixir","electro-titan","Electro Titan"],["elixir","root-rider","Root Rider"],["elixir","thrower","Thrower"],
  ["elixir","meteor-golem","Meteor Golem"],
  // Dark Elixir Troops (13)
  ["darkElixir","minion","Minion"],["darkElixir","hog-rider","Hog Rider"],["darkElixir","valkyrie","Valkyrie"],
  ["darkElixir","golem","Golem"],["darkElixir","witch","Witch"],["darkElixir","lava-hound","Lava Hound"],

const SCHEMA_VERSION = 2;
const ID_RENAME_MAP = { "super-pekka-bb":"power-pekka" };

/* ---------------- State ---------------- */
let roster = null;         // { cards:[...], schemaVersion }
let accountsMeta = null;   // { list:[{name, locked}] }
let collections = null;    // { account: { cardId: count } }
let tradeLog = null;       // { entries:[...] }
let settings = null;       // { mode:'view'|'contribute', myAccount:string|null }

let currentCategory = "elixir";
let viewingAccount = null;
let editingAccount = null;
let becomingContributor = false;

let pollTimer = null;

function catInfo(key){ return CATEGORIES.find(c=>c.key===key); }

/* ---------------- Raw storage helpers ---------------- */
async function getSharedRaw(key){
  try{ const res = await window.storage.get(key, true); return (res && res.value) ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function setSharedRaw(key, obj){
  try{ await window.storage.set(key, JSON.stringify(obj), true); return true; }
  catch(e){ console.error("shared save failed", key, e); flashStatus("⚠ Sync failed — your change may not be visible to others yet."); return false; }
}
async function getPersonalRaw(key){
  try{ const res = await window.storage.get(key, false); return (res && res.value) ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function setPersonalRaw(key, obj){
  try{ await window.storage.set(key, JSON.stringify(obj), false); }
  catch(e){ console.error("personal save failed", key, e); }
}
// Refetch-then-mutate-then-write: reduces (does not eliminate) collision damage
// from two people editing the shared blob at the same moment.
async function withFreshShared(key, mutator, fallback){
  let latest = fallback;
  try{
    const res = await window.storage.get(key, true);
    if(res && res.value) latest = JSON.parse(res.value);
  }catch(e){ /* use fallback */ }
  mutator(latest);
  await setSharedRaw(key, latest);
  return latest;
}

/* ---------------- Load / migrate ---------------- */
async function loadAll(){
  let r = await getSharedRaw(K_ROSTER);
  if(!r){
    r = { cards: DEFAULT_CARDS.map(c=>({...c})), schemaVersion: SCHEMA_VERSION };
    await setSharedRaw(K_ROSTER, r);
  }
  roster = r;

  let a = await getSharedRaw(K_ACCOUNTS);
  let c = await getSharedRaw(K_COLLECTIONS);
  if(!a || !c){
    // one-time best-effort pickup of this browser's pre-gallery personal data
    const legacy = await getPersonalRaw(LEGACY_KEY);
    if(legacy && legacy.accounts && legacy.collections){
      a = { list: legacy.accounts.map(name=>({name, locked:false})) };
      c = legacy.collections;
    } else {
      a = { list: [{name:"Clasher", locked:false}] };
      c = { "Clasher": {} };
    }
    await setSharedRaw(K_ACCOUNTS, a);
    await setSharedRaw(K_COLLECTIONS, c);
  }
  accountsMeta = a;
  collections = c;

  if(roster.schemaVersion !== SCHEMA_VERSION){
    Object.values(collections).forEach(col=>{
      Object.keys(ID_RENAME_MAP).forEach(oldId=>{
        if(col[oldId] !== undefined){
          const newId = ID_RENAME_MAP[oldId];
          col[newId] = (col[newId]||0) + col[oldId];
          delete col[oldId];
        }
      });
    });
    roster.cards = DEFAULT_CARDS.map(c=>({...c}));
    roster.schemaVersion = SCHEMA_VERSION;
    await setSharedRaw(K_ROSTER, roster);
    await setSharedRaw(K_COLLECTIONS, collections);
  }

  let t = await getSharedRaw(K_TRADELOG);
  if(!t){ t = { entries: [] }; await setSharedRaw(K_TRADELOG, t); }
  tradeLog = t;

  let s = await getPersonalRaw(K_SETTINGS);
  if(!s) s = { mode: "view", myAccount: null };
  settings = s;

  const stillExists = settings.myAccount && accountsMeta.list.find(x=>x.name===settings.myAccount);
  viewingAccount = stillExists ? settings.myAccount : (accountsMeta.list[0] ? accountsMeta.list[0].name : null);
}

/* ---------------- Derived data ---------------- */
function activeCards(){ return roster.cards.filter(c=>!c.excluded); }
function cardsInCat(cat){ return roster.cards.filter(c=>c.category===cat && !c.excluded); }
function getCount(account, cardId){ return (collections[account] && collections[account][cardId]) || 0; }
function canEditViewing(){ return settings.mode==='contribute' && settings.myAccount && viewingAccount===settings.myAccount; }
function accountLocked(name){ const a = accountsMeta.list.find(x=>x.name===name); return !!(a && a.locked); }

async function bumpCount(account, cardId, delta){
  if(!collections[account]) collections[account] = {};
  collections[account][cardId] = Math.max(0, (collections[account][cardId]||0) + delta);
  render();
  const latest = await withFreshShared(K_COLLECTIONS, latest=>{
    if(!latest[account]) latest[account] = {};
    latest[account][cardId] = Math.max(0, (latest[account][cardId]||0) + delta);
  }, collections);
  collections = latest;
}

/* ---------------- Toast / status ---------------- */
function flashStatus(msg){
  let el = document.getElementById("global-toast");
  if(!el){
    el = document.createElement("div");
    el.id = "global-toast";
    el.className = "global-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ el.classList.remove("show"); }, 2600);
}

/* ---------------- Sync polling ---------------- */
async function refreshFromServer(manual){
  const [r,a,c,t] = await Promise.all([
    getSharedRaw(K_ROSTER), getSharedRaw(K_ACCOUNTS), getSharedRaw(K_COLLECTIONS), getSharedRaw(K_TRADELOG)
  ]);
  let changed = false;
  if(r && JSON.stringify(r) !== JSON.stringify(roster)){ roster = r; changed = true; }
  if(a && JSON.stringify(a) !== JSON.stringify(accountsMeta)){
    accountsMeta = a; changed = true;
    if(!accountsMeta.list.find(x=>x.name===viewingAccount)) viewingAccount = accountsMeta.list[0] ? accountsMeta.list[0].name : null;
  }
  if(c && JSON.stringify(c) !== JSON.stringify(collections)){ collections = c; changed = true; }
  if(t && JSON.stringify(t) !== JSON.stringify(tradeLog)){ tradeLog = t; changed = true; }
  lastSyncTs = Date.now();

  const active = document.activeElement;
  const appEl = document.getElementById("app");
  const isTyping = active && appEl && appEl.contains(active) && ["INPUT","TEXTAREA","SELECT"].includes(active.tagName);

  if((changed || manual) && !isTyping){
    render();
  } else {
    const sb = document.querySelector(".sync-bar");
    if(sb) sb.outerHTML = renderSyncBar();
  }
}

/* ---------------- Rendering ---------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderHeader()}
    ${renderSyncBar()}
    ${renderModeBar()}
    ${renderAccountBar()}
    ${renderViewTabs()}
    <div class="view ${currentView==='binder'?'active':''}" id="view-binder">${renderBinderView()}</div>
    <div class="view ${currentView==='matrix'?'active':''}" id="view-matrix">${renderMatrixView()}</div>
    <div class="view ${currentView==='trade'?'active':''}" id="view-trade">${renderTradeView()}</div>
    <div class="view ${currentView==='data'?'active':''}" id="view-data">${renderDataView()}</div>
    <div class="view ${currentView==='editor'?'active':''}" id="view-editor">${renderEditorView()}</div>
  `;
  attachHandlers();
  if(becomingContributor) focusContributorInput();
  if(editingAccount) focusAccountInput();
}

function renderHeader(){
  const now = new Date();
  const tradeClose = new Date(Date.UTC(2026,8,2,8,0,0)); // Sep 2 2026 08:00 UTC
  const msLeft = tradeClose - now;
  let clockVal, clockSub;
  if(msLeft > 0){
    const days = Math.floor(msLeft/86400000);
    const hrs = Math.floor((msLeft%86400000)/3600000);
    clockVal = `${days}d ${hrs}h`;
    clockSub = "until trading closes";
  } else {
    clockVal = "Closed";
    clockSub = "trading window has ended";
  }
  return `
  <header class="app-head">
    <div class="title-block">
      <h1>🃏 Card Binder</h1>
      <p>One shared gallery, every clan account. Spot duplicates and trades at a glance. Trading closes Sep&nbsp;2, 08:00&nbsp;UTC.</p>
    </div>
    <div class="event-clock">
      <div class="label">Trading window</div>
      <div class="value">${clockVal}</div>
      <div class="sub">${clockSub}</div>
    </div>
  </header>`;
}

function renderSyncBar(){
  const ts = lastSyncTs ? timeAgo(lastSyncTs) : "just now";
  return `<div class="sync-bar">
    <span class="sync-dot"></span> Live gallery · synced ${ts}
    <button class="btn secondary tiny" data-action="refresh-now">Refresh now</button>
  </div>`;
}

function renderModeBar(){
  if(settings.mode==='contribute' && settings.myAccount){
    return `<div class="mode-bar contribute">

    return `<div class="mode-bar">
      <span>Your real in-game account name:</span>
      <input type="text" id="contributor-name-input" class="chip-input" placeholder="e.g. YourClasherName" maxlength="24" autocomplete="off">

      <button class="chip add" data-action="cancel-contributor">Cancel</button>

  }
  return `<div class="mode-bar">
    <span>👀 You're browsing the gallery in view-only mode.</span>
    <button class="chip" data-action="start-contributing">+ Contribute my account</button>
  </div>`;
}

function renderAccountBar(){
  const chips = accountsMeta.list.map(a => {
    if(a.name === editingAccount){
      return `
      <span class="chip-edit-wrap">
        <input type="text" class="chip-input" id="account-name-input" value="${escAttr(a.name)}" maxlength="24" autocomplete="off">
      </span>`;
    }
    const isMine = settings.mode==='contribute' && settings.myAccount===a.name;
    const canManage = isMine && !a.locked;
    return `
    <button class="chip ${a.name===viewingAccount?'active':''}" data-action="select-account" data-account="${escAttr(a.name)}">
      ${escHtml(a.name)}
      ${a.locked ? `<span class="chip-lock" title="Pre-established account — can't be removed">🔒</span>` : ''}
      ${canManage ? `<span class="chip-pencil" data-action="edit-account-name" data-account="${escAttr(a.name)}" title="Rename your account">✎</span>` : ''}
      ${canManage ? `<span class="chip-x" data-action="delete-account" data-account="${escAttr(a.name)}" title="Remove your account">✕</span>` : ''}
    </button>`;
  }).join("");
  return `
  <div class="account-bar">
    <span class="label">Gallery accounts</span>
    ${chips}
    <button class="chip add" data-action="replay-tutorial" style="margin-left:auto;" title="Replay the setup guide">↺ Guide</button>
  </div>`;
}

function focusAccountInput(){
  requestAnimationFrame(()=>{
    const input = document.getElementById("account-name-input");
    if(input){ input.focus(); input.select(); }
  });
}
function focusContributorInput(){
  requestAnimationFrame(()=>{
    const input = document.getElementById("contributor-name-input");
    if(input){ input.focus(); }
  });
}

async function finishAccountEdit(cancel){
  if(editingAccount===null) return;
  const input = document.getElementById("account-name-input");
  const original = editingAccount;
  editingAccount = null;
  if(!input || cancel){ render(); return; }

  const val = input.value.trim();
  if(!val || val===original){ render(); return; }
  if(accountsMeta.list.find(x=>x.name===val)){
    alert(`Someone already has an account named "${val}" in this gallery.`);
    editingAccount = original;
    render();
    focusAccountInput();
    return;
  }

  accountsMeta = await withFreshShared(K_ACCOUNTS, latest=>{
    const acc = latest.list.find(x=>x.name===original);
    if(acc) acc.name = val;
  }, accountsMeta);
  collections = await withFreshShared(K_COLLECTIONS, latest=>{
    latest[val] = latest[original] || {};
    delete latest[original];
  }, collections);
  tradeLog = await withFreshShared(K_TRADELOG, latest=>{
    (latest.entries||[]).forEach(t=>{
      if(t.from===original) t.from = val;
      if(t.to===original) t.to = val;
    });
  }, tradeLog);

  if(viewingAccount===original) viewingAccount = val;
  if(settings.myAccount===original){ settings.myAccount = val; await setPersonalRaw(K_SETTINGS, settings); }
  render();
}

function renderViewTabs(){
  const tabs = [
    ["binder","Gallery Binder"],
    ["matrix","Collection Matrix"],
    ["trade","Trade Finder"],
    ["data","Import / Export"],
    ["editor","Card List"]
  ];
  return `<div class="view-tabs">${tabs.map(([k,label])=>`
    <button class="view-tab ${currentView===k?'active':''}" data-action="set-view" data-view="${k}">${label}</button>
  `).join("")}</div>`;
}

function renderBinderView(){
  if(!viewingAccount){
    return `<div class="empty-note">No accounts in the gallery yet. Add yourself via "+ Contribute my account" above.</div>`;
  }
  const acct = viewingAccount;
  const editable = canEditViewing();
  const all = activeCards();
  const ownedTotal = all.filter(c => getCount(acct,c.id) > 0).length;
  const pct = all.length ? Math.round(ownedTotal/all.length*100) : 0;

  const catCards = CATEGORIES.map(cat=>{
    const cards = cardsInCat(cat.key);
    const owned = cards.filter(c=>getCount(acct,c.id)>0).length;
    const p = cards.length ? Math.round(owned/cards.length*100) : 0;
    return `
    <div class="cat-card ${currentCategory===cat.key?'selected':''}" data-action="set-category" data-cat="${cat.key}" style="--catcolor:${cat.hex}">
      <div class="cat-name"><span class="cat-dot" style="background:${cat.color}"></span>${cat.label}</div>
      <div class="cat-progress-track"><div class="cat-progress-fill" style="width:${p}%;background:${cat.color}"></div></div>
      <div class="cat-count">${owned} / ${cards.length} collected</div>
    </div>`;
  }).join("");

  const cardsHtml = all.map(c => renderCardSlot(acct, c, catInfo(c.category), editable)).join("");

  return `
  <div class="overall-bar" style="--pct:${pct}">
    <div class="ring"><span>${pct}%</span></div>
    <div class="txt"><b>${escHtml(acct)}</b> has collected <b>${ownedTotal}</b> of <b>${all.length}</b> tradeable cards.</div>
    ${!editable ? `<span class="readonly-tag">Read-only${accountLocked(acct)?' · pre-established':''}</span>` : ''}
  </div>
  <div class="cat-row">${catCards}</div>
  <div class="binder-page">
    <div class="card-grid">${cardsHtml}</div>
  </div>`;
}

function renderCardSlot(acct, card, cat, editable){
  const n = getCount(acct, card.id);
  const isExcluded = card.excluded;
  let cls = "card-slot";
  if(isExcluded) cls += " excluded";
  else if(n>=2) cls += " owned dup";
  else if(n===1) cls += " owned";
  else cls += " empty";

  const img = imageFor(card);
  const imgVar = img ? `--cardimg:url('${img.replace(/'/g,"%27")}');` : "";
  const badge = (!isExcluded && n>=2) ? `<div class="card-dup-badge">×${n}</div>` : "";

  let stepper;
  if(isExcluded){
    stepper = `<div class="excl-tag">Not in event</div>`;
  } else if(editable){
    stepper = `<div class="card-stepper">
      <button data-action="dec" data-card="${escAttr(card.id)}" ${n<=0?'disabled':''}>−</button>
      <span class="count">${n}</span>
      <button data-action="inc" data-card="${escAttr(card.id)}">+</button>
    </div>`;
  } else {
    stepper = `<div class="readonly-count">${n} owned</div>`;
  }

  return `
  <div id="slot-${escAttr(card.id)}" class="${cls}" style="--catcolor:${cat.hex};--catbg:${cat.dim};${imgVar}" title="${escAttr(card.name)}">
    <div class="card-art"><div class="card-art-img"></div>${badge}</div>
    <div class="card-name">${escHtml(card.name)}</div>
    ${stepper}
  </div>`;
}

function scrollToCategory(catKey){
  currentCategory = catKey;
  render();
  requestAnimationFrame(()=>{
    const cards = cardsInCat(catKey);
    if(!cards.length) return;
    const el = document.getElementById('slot-'+cards[0].id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

/* ---------------- Trade Finder: community duplicates board + public history ---------------- */
function computeDuplicates(){
  const rows = [];
  activeCards().forEach(card=>{
    accountsMeta.list.forEach(a=>{
      const n = getCount(a.name, card.id);
      const spare = n>=2 ? n-1 : 0;
      if(spare<=0) return;
      if(tradeFilterCat!=="all" && card.category!==tradeFilterCat) return;
      if(tradeFilterQuery && !card.name.toLowerCase().includes(tradeFilterQuery.toLowerCase())) return;
      if(tradeFilterNeedsOnly){
        if(!settings.myAccount) return;
        if(a.name===settings.myAccount) return;
        if(getCount(settings.myAccount, card.id) > 0) return;
      }
      rows.push({account:a.name, card, spare});
    });
  });
  return rows;
}

function renderTradeView(){
  const rows = computeDuplicates();
  const catOpts = [`<option value="all">All categories</option>`]
    .concat(CATEGORIES.map(c=>`<option value="${c.key}" ${tradeFilterCat===c.key?'selected':''}>${c.label}</option>`)).join("");

  const boardHtml = !rows.length
    ? `<div class="empty-note">No duplicates matching these filters right now.</div>`
    : rows.map(row=>{
        const cat = catInfo(row.card.category);
        const otherAccounts = accountsMeta.list.filter(a=>a.name!==row.account);
        const selectId = `recv-${row.account}-${row.card.id}`.replace(/[^a-zA-Z0-9-]/g,'');
        return `
        <div class="duptrade-row">
          <span class="who">${escHtml(row.account)}</span>
          <span class="tag" style="background:${cat.hex}">${cat.label.replace(' Troops','')}</span>
          <span>has ${escHtml(row.card.name)}</span>
          <span class="spare">×${row.spare} spare</span>
          <div class="duptrade-right">
            <select id="${selectId}" data-role="recipient-select">
              <option value="">Send to…</option>
              ${otherAccounts.map(a=>`<option value="${escAttr(a.name)}">${escHtml(a.name)}</option>`).join("")}
            </select>
            <button class="btn tiny" data-action="log-trade" data-from="${escAttr(row.account)}" data-card="${escAttr(row.card.id)}" data-select="${selectId}">✓ Log trade</button>
          </div>
        </div>`;
      }).join("");

  const log = (tradeLog.entries||[]).slice().reverse().slice(0,50);
  const logHtml = !log.length ? `<div class="empty-note">No trades logged yet.</div>` : log.map(t=>{
    const card = roster.cards.find(c=>c.id===t.cardId);
    const cat = card ? catInfo(card.category) : {hex:'#888'};
    return `<div class="trade-item">
      <span>${escHtml(t.cardName)} <span class="tag" style="background:${cat.hex};margin-left:6px;">${cat.label ? cat.label.replace(' Troops','') : ''}</span> — <span style="color:var(--ink-dim);">${escHtml(t.from)} → ${escHtml(t.to)}</span></span>
      <div class="trade-item-right">
        <span class="log-time">${timeAgo(t.ts)}</span>
        <button class="btn tiny secondary" data-action="undo-trade" data-logid="${t.id}">Undo</button>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="panel-box" style="margin-bottom:14px;">
    <p style="margin:0;">This is a <b>record</b>, not an in-game trade bot — it tracks trades you've already made face-to-face so everyone's binder count stays accurate and the history stays transparent.</p>
  </div>
  <div class="trade-filter-row">
    <input type="text" id="trade-search" placeholder="Search a card…" value="${escAttr(tradeFilterQuery)}">
    <select id="trade-cat-filter">${catOpts}</select>
    <label><input type="checkbox" id="trade-needs-only" ${tradeFilterNeedsOnly?'checked':''} ${!settings.myAccount?'disabled':''}> Only show what I need</label>
  </div>
  <div class="duptrade-list">${boardHtml}</div>
  <div class="panel-box">
    <h3 style="margin-bottom:10px;">Public trade history</h3>
    ${logHtml}
  </div>`;
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  const m = Math.floor(s/60); if(m<60) return m+"m ago";
  const h = Math.floor(m/60); if(h<24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
}

async function logTrade(giver, receiver, cardId){
  const card = roster.cards.find(c=>c.id===cardId);
  if(!card || !giver || !receiver || giver===receiver) return;

  let latestColl = collections;
  try{
    const res = await window.storage.get(K_COLLECTIONS, true);
    if(res && res.value) latestColl = JSON.parse(res.value);
  }catch(e){ /* fall back to local */ }

  const giverCount = (latestColl[giver] && latestColl[giver][cardId]) || 0;
  if(giverCount < 2){
    collections = latestColl;
    flashStatus("That duplicate isn't available anymore — someone traded it first.");
    render();
    return;
  }
  latestColl[giver][cardId] = giverCount - 1;
  if(!latestColl[receiver]) latestColl[receiver] = {};
  latestColl[receiver][cardId] = (latestColl[receiver][cardId]||0) + 1;
  await setSharedRaw(K_COLLECTIONS, latestColl);
  collections = latestColl;

  tradeLog = await withFreshShared(K_TRADELOG, latest=>{
    latest.entries = latest.entries || [];
    latest.entries.push({
      id: "t"+Date.now()+Math.random().toString(36).slice(2,7),
      from: giver, to: receiver, cardId, cardName: card.name, ts: Date.now()
    });
    if(latest.entries.length > 500) latest.entries = latest.entries.slice(-500);
  }, tradeLog);

  flashStatus(`${card.name}: ${giver} → ${receiver} logged for everyone.`);
  render();
}

async function undoTrade(logId){
  let latestLog = tradeLog;
  try{
    const res = await window.storage.get(K_TRADELOG, true);
    if(res && res.value) latestLog = JSON.parse(res.value);
  }catch(e){}
  const entry = (latestLog.entries||[]).find(t=>t.id===logId);
  if(!entry) return;

  collections = await withFreshShared(K_COLLECTIONS, latest=>{
    if(!latest[entry.from]) latest[entry.from] = {};
    latest[entry.from][entry.cardId] = (latest[entry.from][entry.cardId]||0) + 1;
    if(latest[entry.to]) latest[entry.to][entry.cardId] = Math.max(0, (latest[entry.to][entry.cardId]||0) - 1);
  }, collections);

  latestLog.entries = latestLog.entries.filter(t=>t.id!==logId);
  await setSharedRaw(K_TRADELOG, latestLog);
  tradeLog = latestLog;

  flashStatus("Trade undone for everyone.");
  render();
}

/* ---------------- Handlers ---------------- */

function escHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return escHtml(s); }
function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('card-'+Date.now()); }

function attachHandlers(){
  const app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("change", onChange);
  app.addEventListener("keydown", onAccountNameKeyDown);
  app.addEventListener("focusout", onAccountNameFocusOut);
}

function onAccountNameKeyDown(e){
  if(e.target && e.target.id==="account-name-input"){
    if(e.key==="Enter"){ e.preventDefault(); finishAccountEdit(false); }
    else if(e.key==="Escape"){ e.preventDefault(); finishAccountEdit(true); }
  }
  if(e.target && e.target.id==="contributor-name-input" && e.key==="Enter"){
    e.preventDefault();
    confirmContributor();
  }
}
function onAccountNameFocusOut(e){
  if(!e.target || e.target.id!=="account-name-input") return;
  finishAccountEdit(false);
}

async function confirmContributor(){
  const input = document.getElementById("contributor-name-input");
  if(!input) return;
  const name = input.value.trim();
  if(!name) return;
  const existing = accountsMeta.list.find(x=>x.name===name);
  if(existing && existing.locked){
    alert(`"${name}" is a protected, pre-established account. Pick a different name, or ask whoever set it up to unlock it.`);
    return;
  }
  if(!existing){
    accountsMeta = await withFreshShared(K_ACCOUNTS, latest=>{
      latest.list = latest.list || [];
      if(!latest.list.find(x=>x.name===name)) latest.list.push({name, locked:false});
    }, accountsMeta);
    collections = await withFreshShared(K_COLLECTIONS, latest=>{
      if(!latest[name]) latest[name] = {};
    }, collections);
  }
  settings.myAccount = name;
  settings.mode = "contribute";
  await setPersonalRaw(K_SETTINGS, settings);
  viewingAccount = name;
  becomingContributor = false;
  render();
}

function onClick(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="refresh-now"){ refreshFromServer(true); flashStatus("Synced."); return; }

  if(action==="set-view"){ currentView = el.dataset.view; render(); return; }
  if(action==="set-category"){ scrollToCategory(el.dataset.cat); return; }

  if(action==="start-contributing"){ becomingContributor = true; render(); return; }
  if(action==="cancel-contributor"){ becomingContributor = false; render(); return; }
  if(action==="confirm-contributor"){ confirmContributor(); return; }
  if(action==="stop-contributing"){ settings.mode = "view"; setPersonalRaw(K_SETTINGS, settings); render(); return; }

  if(action==="replay-tutorial"){ startTutorial(); return; }

  if(action==="select-account"){ viewingAccount = el.dataset.account; render(); return; }
  if(action==="edit-account-name"){
    e.stopPropagation();
    editingAccount = el.dataset.account;
    render();
    focusAccountInput();
    return;
  }
  if(action==="delete-account"){
    e.stopPropagation();
    const acc = el.dataset.account;
    if(accountLocked(acc)) return;
    if(confirm(`Remove "${acc}" and its collection from the shared gallery? This can't be undone.`)){
      (async ()=>{
        accountsMeta = await withFreshShared(K_ACCOUNTS, latest=>{
          latest.list = latest.list.filter(x=>x.name!==acc);
        }, accountsMeta);
        collections = await withFreshShared(K_COLLECTIONS, latest=>{
          delete latest[acc];
        }, collections);
        if(settings.myAccount===acc){
          settings.myAccount = null;
          settings.mode = "view";
          await setPersonalRaw(K_SETTINGS, settings);
        }
        if(viewingAccount===acc) viewingAccount = accountsMeta.list[0] ? accountsMeta.list[0].name : null;
        render();
      })();
    }
    return;
  }

  if(action==="inc" || action==="dec"){
    if(!canEditViewing()) return;
    const cardId = el.dataset.card;
    bumpCount(viewingAccount, cardId, action==="inc" ? 1 : -1);
    return;
  }

  if(action==="log-trade"){
    const from = el.dataset.from;
    const cardId = el.dataset.card;
    const select = document.getElementById(el.dataset.select);
    const to = select ? select.value : "";
    if(!to){ flashStatus("Pick who's receiving it first."); return; }
    logTrade(from, to, cardId);
    return;
  }
  if(action==="undo-trade"){ undoTrade(el.dataset.logid); return; }

  if(action==="copy-export"){
    const box = document.getElementById("export-box");
    box.select();
    navigator.clipboard?.writeText(box.value).then(()=>flashStatus("Copied to clipboard.")).catch(()=>flashStatus("Couldn't copy — select and copy manually."));
    return;
  }
  if(action==="import-full"){
    const raw = document.getElementById("import-box").value.trim();
    if(!raw) return;
    if(!confirm("This replaces the shared gallery for EVERYONE currently using this page. Continue?")) return;
    try{
      const parsed = JSON.parse(raw);
      if(!parsed.roster || !parsed.accounts || !parsed.collections) throw new Error("shape");
      (async ()=>{
        await setSharedRaw(K_ROSTER, parsed.roster);
        await setSharedRaw(K_ACCOUNTS, parsed.accounts);
        await setSharedRaw(K_COLLECTIONS, parsed.collections);
        if(parsed.tradeLog) await setSharedRaw(K_TRADELOG, parsed.tradeLog);
        roster = parsed.roster; accountsMeta = parsed.accounts; collections = parsed.collections;
        tradeLog = parsed.tradeLog || {entries:[]};
        if(!accountsMeta.list.find(x=>x.name===viewingAccount)) viewingAccount = accountsMeta.list[0] ? accountsMeta.list[0].name : null;
        currentView = "binder";
        render();
      })();
    }catch(err){
      alert("That doesn't look like valid exported data from this app.");
    }
    return;
  }
  if(action==="protect-accounts"){
    const raw = document.getElementById("protect-box").value.trim();
    if(!raw) return;
    const names = raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
    if(!names.length) return;
    (async ()=>{
      accountsMeta = await withFreshShared(K_ACCOUNTS, latest=>{
        latest.list = latest.list || [];
        names.forEach(n=>{
          const existing = latest.list.find(x=>x.name===n);
          if(existing) existing.locked = true;
          else latest.list.push({name:n, locked:true});
        });
      }, accountsMeta);
      collections = await withFreshShared(K_COLLECTIONS, latest=>{
        names.forEach(n=>{ if(!latest[n]) latest[n] = {}; });
      }, collections);
      flashStatus(`Locked ${names.length} account${names.length===1?'':'s'} into the gallery.`);
      render();
    })();
    return;
  }
  if(action==="bulk-set"){
    if(!canEditViewing()) return;
    const raw = document.getElementById("bulk-box").value.trim();
    if(!raw) return;
    const pairs = raw.split(",").map(s=>s.trim()).filter(Boolean);
    (async ()=>{
      let applied = 0, skipped = [];
      const ops = [];
      pairs.forEach(p=>{
        const [id, val] = p.split(":").map(s=>s.trim());
        const n = parseInt(val,10);
        if(roster.cards.find(c=>c.id===id) && !isNaN(n)){ ops.push([id,n]); applied++; }
        else skipped.push(p);
      });
      collections = await withFreshShared(K_COLLECTIONS, latest=>{
        if(!latest[viewingAccount]) latest[viewingAccount] = {};
        ops.forEach(([id,n])=>{ latest[viewingAccount][id] = Math.max(0,n); });
      }, collections);
      flashStatus(`Applied ${applied} card${applied===1?'':'s'}.${skipped.length? ' Skipped: '+skipped.join(', ') : ''}`);
      render();
    })();
    return;
  }

  if(action==="delete-card"){
    if(settings.mode!=='contribute') return;
    const id = el.dataset.card;
    if(confirm("Remove this card from the shared roster? Collected counts for it will be lost across every account.")){
      (async ()=>{
        roster = await withFreshShared(K_ROSTER, latest=>{
          latest.cards = latest.cards.filter(c=>c.id!==id);
        }, roster);
        collections = await withFreshShared(K_COLLECTIONS, latest=>{
          Object.values(latest).forEach(col=>{ delete col[id]; });
        }, collections);
        render();
      })();
    }
    return;
  }
  if(action==="add-card"){
    if(settings.mode!=='contribute') return;
    const nameInput = document.getElementById("new-card-name");
    const catSelect = document.getElementById("new-card-cat");
    const name = nameInput.value.trim();
    if(!name) return;
    (async ()=>{
      roster = await withFreshShared(K_ROSTER, latest=>{
        let id = slugify(name), suffix = 1;
        while(latest.cards.find(c=>c.id===id)){ id = slugify(name)+'-'+(++suffix); }
        latest.cards.push({id, name, category: catSelect.value, excluded:false});
      }, roster);
      render();
    })();
    return;
  }
}

function onChange(e){
  const t = e.target;

  if(t.id==="trade-search"){ tradeFilterQuery = t.value; render(); return; }
  if(t.id==="trade-cat-filter"){ tradeFilterCat = t.value; render(); return; }
  if(t.id==="trade-needs-only"){ tradeFilterNeedsOnly = t.checked; render(); return; }

  if(t.dataset && t.dataset.edit){
    if(settings.mode!=='contribute') return;
    const cardId = t.dataset.card;
    const editType = t.dataset.edit;
    const value = editType==='excluded' ? t.checked : t.value;
    (async ()=>{
      roster = await withFreshShared(K_ROSTER, latest=>{
        const card = latest.cards.find(c=>c.id===cardId);
        if(!card) return;
        if(editType==="name") card.name = value;
        if(editType==="category") card.category = value;
        if(editType==="excluded") card.excluded = value;
      }, roster);
      if(editType!=="name") render();
    })();
  }
}

/* ---------------- Onboarding tutorial ---------------- */
let tutorialActive = false;
let tutorialStep = 0;
const TUTORIAL_STEPS = [
  {
    view: "binder",
    getTarget: () => document.querySelector(".binder-page"),
    title: "Match your binder to your game",
    text: "Start here at the bottom. Go card by card and tap + for every duplicate you actually own in-game, so this binder mirrors your real collection."
  },
  {
    view: null,
    getTarget: () => document.querySelector('[data-action="start-contributing"]') || document.querySelector(".chip.active .chip-pencil"),
    title: "Add yourself to the gallery",
    text: "Tap \"Contribute my account\" and enter your real in-game account name — that's what everyone else will see you as in the gallery and trade history."
  },
  {
    view: "data",
    getTarget: () => document.querySelector('[data-action="copy-export"]'),
    title: "Back up the gallery",
    text: "Head to Import / Export and hit \"Copy to clipboard\" any time you want a snapshot of the whole shared gallery saved somewhere safe."
  }
];

function startTutorial(){
  tutorialActive = true;
  tutorialStep = 0;
  showTutorialStep();
}
function showTutorialStep(){
  const step = TUTORIAL_STEPS[tutorialStep];
  if(step.view && step.view !== currentView){ currentView = step.view; render(); }
  requestAnimationFrame(()=>{
    const el = TUTORIAL_STEPS[tutorialStep].getTarget();
    if(el && el.scrollIntoView){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(renderTutorialOverlay, 260);
    } else {
      renderTutorialOverlay();
    }
  });
}
function advanceTutorial(){
  if(tutorialStep < TUTORIAL_STEPS.length-1){ tutorialStep++; showTutorialStep(); }
  else { endTutorial(); }
}
function endTutorial(){
  tutorialActive = false;
  renderTutorialOverlay();
  markTutorialSeen();
}
async function markTutorialSeen(){
  try{ await window.storage.set(TUTORIAL_KEY, "1", false); }catch(e){}
}
function renderTutorialOverlay(){
  const root = document.getElementById("tutorial-root");
  if(!root) return;
  if(!tutorialActive){ root.style.display = "none"; root.innerHTML = ""; return; }

  const step = TUTORIAL_STEPS[tutorialStep];
  const targetEl = step.getTarget();
  if(!targetEl){ requestAnimationFrame(renderTutorialOverlay); return; }
  root.style.display = "block";

  const pad = 8;
  const r = targetEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const top = Math.max(0, r.top - pad);
  const left = Math.max(0, r.left - pad);
  const w = Math.min(vw, r.width + pad*2);
  const h = Math.min(vh, r.height + pad*2);

  const masks = [
    {t:0, l:0, w:vw, h:top},
    {t:top+h, l:0, w:vw, h:Math.max(0, vh-(top+h))},
    {t:top, l:0, w:left, h:h},
    {t:top, l:left+w, w:Math.max(0, vw-(left+w)), h:h}
  ].map(m=>`<div class="tutorial-mask" style="top:${m.t}px;left:${m.l}px;width:${m.w}px;height:${m.h}px;"></div>`).join("");

  let cardTop = top + h + 14;
  if(cardTop + 190 > vh) cardTop = Math.max(10, top - 14 - 170);
  let cardLeft = Math.min(Math.max(10, left), vw - 320);

  root.innerHTML = `
    ${masks}
    <div class="tutorial-ring" style="top:${top}px;left:${left}px;width:${w}px;height:${h}px;"></div>
    <div class="tutorial-card" style="top:${cardTop}px;left:${cardLeft}px;">
      <div class="tutorial-progress">Step ${tutorialStep+1} of ${TUTORIAL_STEPS.length}</div>
      <h4>${escHtml(step.title)}</h4>
      <p>${escHtml(step.text)}</p>
      <div class="tutorial-actions">
        <button class="tutorial-btn skip" data-taction="skip">Skip</button>
        <button class="tutorial-btn next" data-taction="next">${tutorialStep===TUTORIAL_STEPS.length-1?'Done':'Next'}</button>
      </div>
    </div>`;
}
function attachTutorialHandlers(){
  const root = document.getElementById("tutorial-root");
  root.addEventListener("click", e=>{
    const btn = e.target.closest("[data-taction]");
    if(!btn) return;
    if(btn.dataset.taction==="next") advanceTutorial();
    else if(btn.dataset.taction==="skip") endTutorial();
  });
  window.addEventListener("resize", ()=>{ if(tutorialActive) renderTutorialOverlay(); });
  window.addEventListener("scroll", ()=>{ if(tutorialActive) renderTutorialOverlay(); }, true);
}

/* ---------------- Boot ---------------- */
(async function boot(){
  await loadAll();
  lastSyncTs = Date.now();
  render();
  attachTutorialHandlers();

  pollTimer = setInterval(()=>refreshFromServer(false), 7000);
  window.addEventListener("focus", ()=>refreshFromServer(true));

  let seenTutorial = false;
  try{
    const res = await window.storage.get(TUTORIAL_KEY, false);
    seenTutorial = !!(res && res.value === "1");
  }catch(e){ seenTutorial = false; }
  if(!seenTutorial) startTutorial();
})();
</script>
